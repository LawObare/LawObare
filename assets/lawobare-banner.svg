<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">LawObare developer banner</title>
  <desc id="desc">Lawrence Obare backend developer profile banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.55" stop-color="#0b1622"/>
      <stop offset="1" stop-color="#061014"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <g opacity=".18" stroke="#00d9ff">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200"/>
    <path d="M120 0V300M240 0V300M360 0V300M480 0V300M600 0V300M720 0V300M840 0V300M960 0V300M1080 0V300"/>
  </g>

  <path d="M60 232 C250 80 430 265 610 130 S940 55 1140 210" fill="none" stroke="url(#line)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="610" cy="130" r="7" fill="#00d9ff" filter="url(#glow)"/>

  <g font-family="monospace">
    <text x="72" y="72" fill="#7dd3fc" font-size="18">$ ./lawobare</text>
    <text x="72" y="125" fill="#ffffff" font-size="42" font-weight="700">LAW/OBARE</text>
    <text x="74" y="158" fill="#94a3b8" font-size="18">backend developer · builder · learner</text>
    <text x="74" y="198" fill="#00d9ff" font-size="16">Go  /  PostgreSQL  /  APIs  /  Web</text>
    <text x="875" y="72" fill="#64748b" font-size="14">SYSTEM STATUS</text>
    <text x="875" y="101" fill="#22c55e" font-size="18">● ONLINE</text>
    <text x="875" y="132" fill="#64748b" font-size="14">MODE</text>
    <text x="875" y="158" fill="#e2e8f0" font-size="18">BUILDING</text>
    <text x="875" y="215" fill="#475569" font-size="13">KE · 2026</text>
  </g>
</svg>
